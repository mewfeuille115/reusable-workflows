name: Trivy container scan

on:
  workflow_call:
    inputs:
      image-name:
        description: Local image name (without tag)
        type: string
        required: true
      dockerfile:
        type: string
        default: Dockerfile
      context:
        type: string
        default: .
      severity:
        type: string
        default: HIGH,CRITICAL

jobs:
  scan:
    name: Docker build + Trivy
    runs-on: ubuntu-latest
    env:
      IMAGE_REF: ${{ inputs.image-name }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v6

      - name: Build image
        run: |
          docker build --pull \
            -t "$IMAGE_REF" \
            -f "${{ inputs.dockerfile }}" \
            "${{ inputs.context }}"

      - name: Run Trivy (SARIF for GitHub)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: sarif
          output: trivy.sarif
          severity: ${{ inputs.severity }}
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload SARIF
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ inputs.image-name }}

      - name: Run Trivy (table + block)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          severity: ${{ inputs.severity }}
          exit-code: '1'
          ignore-unfixed: true
