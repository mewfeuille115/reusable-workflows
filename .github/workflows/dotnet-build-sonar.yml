name: .NET build, test and SonarCloud

on:
  workflow_call:
    inputs:
      solution-path:
        type: string
        required: true
      exclude-projects:
        description: Comma-separated project suffixes to exclude from the CI solution (e.g. the .esproj frontend, which dotnet restore does not support)
        type: string
        default: '.esproj'
      dotnet-version:
        type: string
        default: '10.0.x'
      configuration:
        type: string
        default: Release
      run-sonar:
        description: Set to false for pull requests from forks (they do not have access to secrets)
        type: boolean
        default: true
      sonar-project-key:
        type: string
        default: ''
      sonar-organization:
        type: string
        default: ''
      sonar-coverage-exclusions:
        description: Comma-separated patterns to exclude from coverage
        type: string
        default: '**/Migrations/**,**/*Dto.cs,**/Program.cs'
      generated-secrets:
        description: Comma-separated environment variable names to fill with random ephemeral values before the tests run (e.g. secrets that Testcontainers-based fixtures inject into throwaway containers)
        type: string
        default: ''
      frontend-working-directory:
        description: Optional frontend directory containing package.json and package-lock.json
        type: string
        default: ''
      frontend-test-command:
        description: Frontend command that generates coverage (for example npm ci && npm run test:coverage)
        type: string
        default: npm ci && npm run test:coverage
      frontend-lcov-path:
        description: Optional LCOV report path relative to the repository root
        type: string
        default: ''
      frontend-node-version:
        description: Node.js version used by the optional frontend test step
        type: string
        default: '22'
    secrets:
      SONAR_TOKEN:
        required: false

jobs:
  build:
    name: Build, test, coverage and Sonar
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_KEY: ${{ inputs.sonar-project-key }}
      SONAR_ORG: ${{ inputs.sonar-organization }}
      SONAR_COV_EXCL: ${{ inputs.sonar-coverage-exclusions }}
      SONAR_JS_LCOV_PATH: ${{ inputs.frontend-lcov-path }}
    steps:
      - name: Checkout (full history for Sonar blame / new code)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Setup Node
        if: inputs.frontend-working-directory != ''
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.frontend-node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.frontend-working-directory }}/package-lock.json

      - name: Setup Java 17 (required by the Sonar scanner)
        if: inputs.run-sonar
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Sonar packages
        if: inputs.run-sonar
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}

      - name: Install dotnet-sonarscanner
        if: inputs.run-sonar
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Prepare solution (exclude non-.NET projects)
        id: sln
        env:
          SOLUTION: ${{ inputs.solution-path }}
          EXCLUDE: ${{ inputs.exclude-projects }}
        run: |
          python3 - <<'PYEOF'
          import os
          import xml.etree.ElementTree as ET

          src = os.environ["SOLUTION"]
          patterns = [p.strip().lower() for p in os.environ["EXCLUDE"].split(",") if p.strip()]
          out = src

          if src.lower().endswith(".slnx") and patterns:
              tree = ET.parse(src)
              removed = []
              for parent in list(tree.getroot().iter()):
                  for child in list(parent):
                      path = child.get("Path", "")
                      if child.tag == "Project" and any(path.lower().endswith(p) for p in patterns):
                          removed.append(path)
                          parent.remove(child)
              out = src[:-len(".slnx")] + ".ci.slnx"
              tree.write(out, encoding="utf-8", xml_declaration=True)
              print("Excluded from CI solution:", removed or "nothing")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"path={out}\n")
          print("Solution used by CI:", out)
          PYEOF

      - name: Restore
        run: dotnet restore "${{ steps.sln.outputs.path }}"

      - name: Run frontend tests with coverage
        if: inputs.frontend-working-directory != ''
        working-directory: ${{ inputs.frontend-working-directory }}
        env:
          FRONTEND_TEST_COMMAND: ${{ inputs.frontend-test-command }}
        run: bash -c "$FRONTEND_TEST_COMMAND"

      # Sonar resuelve las rutas SF: del lcov desde la raiz del repo. Si son relativas al
      # directorio del frontend, la cobertura queda en 0: se normalizan antes del analisis.
      - name: Normalize frontend LCOV paths
        if: inputs.frontend-working-directory != '' && inputs.frontend-lcov-path != ''
        env:
          FRONTEND_DIR: ${{ inputs.frontend-working-directory }}
          LCOV_PATH: ${{ inputs.frontend-lcov-path }}
        run: |
          if [[ ! -f "$LCOV_PATH" ]]; then
            echo "::warning::LCOV report not found at $LCOV_PATH"
            exit 0
          fi
          # Solo prefija las rutas que no son absolutas ni empiezan ya por el directorio del frontend
          sed -i -E "/^SF:/ { /^SF:(\/|[A-Za-z]:|${FRONTEND_DIR//\//\\/})/! s|^SF:|SF:${FRONTEND_DIR}/| }" "$LCOV_PATH"
          echo "First SF entries:"
          grep -m5 '^SF:' "$LCOV_PATH" || true

      - name: Sonar begin
        if: inputs.run-sonar
        run: |
          sonar_args=(
            /k:"$SONAR_KEY" \
            /o:"$SONAR_ORG" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.vscoveragexml.reportsPaths="coverage.xml" \
            /d:sonar.coverage.exclusions="$SONAR_COV_EXCL" \
            /d:sonar.qualitygate.wait=true
          )
          if [[ -n "$SONAR_JS_LCOV_PATH" ]]; then
            sonar_args+=(/d:sonar.javascript.lcov.reportPaths="$SONAR_JS_LCOV_PATH")
          fi
          dotnet sonarscanner begin "${sonar_args[@]}"

      - name: Build
        run: dotnet build "${{ steps.sln.outputs.path }}" --configuration ${{ inputs.configuration }} --no-restore

      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage

      # Values are random per run and never leave the runner: they only seed
      # throwaway containers, so no repository secret is needed (works for forks too).
      # ::add-mask:: is required because values written to GITHUB_ENV are not masked automatically.
      - name: Generate ephemeral test secrets
        if: inputs.generated-secrets != ''
        env:
          NAMES: ${{ inputs.generated-secrets }}
        run: |
          for name in ${NAMES//,/ }; do
            value=$(openssl rand -hex 24)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      # Requires global.json with "test": { "runner": "Microsoft.Testing.Platform" } (.NET 10 SDK)
      - name: Test with coverage (dotnet-coverage, XML format)
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet-coverage collect -f xml -o coverage.xml \
            "dotnet test --solution ${{ steps.sln.outputs.path }} --configuration ${{ inputs.configuration }} --no-restore --no-build"

      - name: Sonar end (waits for the Quality Gate)
        if: inputs.run-sonar
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.xml
            ${{ inputs.frontend-lcov-path }}
          if-no-files-found: ignore