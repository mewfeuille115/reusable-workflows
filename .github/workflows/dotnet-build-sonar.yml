name: .NET build, test and SonarCloud

on:
  workflow_call:
    inputs:
      solution-path:
        type: string
        required: true
      dotnet-version:
        type: string
        default: '10.0.x'
      configuration:
        type: string
        default: Release
      run-sonar:
        description: false en PRs desde forks (no tienen acceso a secrets)
        type: boolean
        default: true
      sonar-project-key:
        type: string
        default: ''
      sonar-organization:
        type: string
        default: ''
      sonar-coverage-exclusions:
        description: Patrones separados por coma excluidos de cobertura
        type: string
        default: '**/Migrations/**,**/*Dto.cs,**/Program.cs'
    secrets:
      SONAR_TOKEN:
        required: false

jobs:
  build:
    name: Build, test, coverage and Sonar
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_KEY: ${{ inputs.sonar-project-key }}
      SONAR_ORG: ${{ inputs.sonar-organization }}
      SONAR_COV_EXCL: ${{ inputs.sonar-coverage-exclusions }}
    steps:
      - name: Checkout (full history for Sonar blame / new code)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Setup Java 17 (required by the Sonar scanner)
        if: inputs.run-sonar
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Sonar packages
        if: inputs.run-sonar
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}

      - name: Install dotnet-sonarscanner
        if: inputs.run-sonar
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore
        run: dotnet restore "${{ inputs.solution-path }}"

      - name: Sonar begin
        if: inputs.run-sonar
        run: |
          dotnet sonarscanner begin \
            /k:"$SONAR_KEY" \
            /o:"$SONAR_ORG" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml" \
            /d:sonar.coverage.exclusions="$SONAR_COV_EXCL" \
            /d:sonar.qualitygate.wait=true

      - name: Build
        run: dotnet build "${{ inputs.solution-path }}" --configuration ${{ inputs.configuration }} --no-restore

      - name: Test with coverage (Coverlet, OpenCover format)
        run: |
          dotnet test "${{ inputs.solution-path }}" \
            --configuration ${{ inputs.configuration }} --no-restore --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            -- DataCollectionRunSettings.DataCollector.Configuration.Format=opencover

      - name: Sonar end (waits for the Quality Gate)
        if: inputs.run-sonar
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-opencover
          path: TestResults/**/coverage.opencover.xml
          if-no-files-found: ignore
